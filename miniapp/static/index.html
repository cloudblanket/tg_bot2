<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Киновечер</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Лобби -->
        <div id="screen-lobby" class="screen active">
            <div class="header">
                <h1>🎬 Киновечер</h1>
                <p class="subtitle">Смотри видео вместе с друзьями</p>
            </div>
            <div class="lobby-content">
                <div class="input-group">
                    <label for="room-code-input">Код комнаты</label>
                    <input type="text" id="room-code-input" placeholder="Введи код комнаты..." maxlength="10">
                </div>
                <button id="btn-join" class="btn btn-primary">Присоединиться</button>
                <div class="divider"><span>или</span></div>
                <button id="btn-create" class="btn btn-secondary">Создать новую комнату</button>
            </div>
        </div>

        <!-- Комната -->
        <div id="screen-room" class="screen">
            <div class="room-header">
                <button id="btn-back" class="btn-icon">←</button>
                <div class="room-info">
                    <h2 id="room-title">Киновечер</h2>
                    <span id="room-code-badge" class="badge"></span>
                </div>
                <button id="btn-theme" class="btn-icon" style="display:none" title="Темы">🎨</button>
                <div id="member-count" class="member-count">0</div>
            </div>

            <!-- Вкладки -->
            <div class="tabs">
                <button class="tab active" data-tab="youtube">🎬 YouTube</button>
                <button class="tab" data-tab="twitch" id="tab-twitch" style="display:none">🔴 Twitch</button>
                <button class="tab" data-tab="upload" id="tab-upload" style="display:none">📤 Загрузка</button>
            </div>

            <!-- YouTube -->
            <div id="tab-content-youtube" class="tab-content active">
                <div id="player-container">
                    <div id="player-placeholder" class="player-placeholder">
                        <span>🎬</span>
                        <p>Добавь видео, чтобы начать</p>
                    </div>
                    <div id="player"></div>
                    <button id="btn-fullscreen" class="btn-fullscreen" title="Кинотеатр">⛶</button>
                </div>
                <div id="controls" class="controls hidden">
                    <button id="btn-seek-back" class="btn-control" title="−10 сек">⏪</button>
                    <button id="btn-play-pause" class="btn-control btn-main" title="Play/Pause">▶️</button>
                    <button id="btn-seek-forward" class="btn-control" title="+10 сек">⏩</button>
                    <span id="current-time" class="time-display">0:00</span>
                </div>
                <div class="add-video-section">
                    <div class="input-group row">
                        <input type="text" id="video-url-input" placeholder="Ссылка на YouTube..." flex="1">
                        <button id="btn-add-video" class="btn btn-primary btn-sm">+</button>
                    </div>
                </div>
                <div id="video-list" class="video-list"></div>
            </div>

            <!-- Twitch -->
            <div id="tab-content-twitch" class="tab-content">
                <div class="add-video-section">
                    <div class="input-group row">
                        <input type="text" id="twitch-channel-input" placeholder="Канал Twitch (напр. shroud)" flex="1">
                        <button id="btn-twitch-play" class="btn btn-primary btn-sm">▶</button>
                    </div>
                </div>
                <div id="twitch-player-container" class="player-container">
                    <div id="twitch-player-placeholder" class="player-placeholder">
                        <span>🔴</span>
                        <p>Введи название канала Twitch</p>
                    </div>
                    <div id="twitch-player"></div>
                    <button id="btn-twitch-fullscreen" class="btn-fullscreen" title="Кинотеатр">⛶</button>
                </div>
            </div>

            <!-- Загрузка -->
            <div id="tab-content-upload" class="tab-content">
                <div class="upload-section">
                    <p>📤 Отправь видео боту в Telegram (/upload), и оно появится здесь.</p>
                    <div id="uploaded-videos" class="video-list"></div>
                </div>
            </div>

            <!-- Участники -->
            <div class="members-section">
                <h3>👥 Участники</h3>
                <div id="members-list" class="members-list"></div>
            </div>

            <!-- Чат -->
            <div class="chat-section">
                <div class="chat-header-row">
                    <h3>💬 Чат</h3>
                    <button id="btn-chat-mode" class="btn-icon" title="Режим чата">💬</button>
                </div>
                <div id="chat-messages" class="chat-messages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="500">
                    <button id="btn-send-chat" class="btn btn-primary btn-sm">→</button>
                </div>
            </div>
        </div>

        <!-- Режим кинотеатра (fullscreen) -->
        <div id="screen-theater" class="screen theater-mode">
            <div class="theater-header">
                <button id="btn-exit-theater" class="btn-icon">✕</button>
                <span id="theater-title" class="theater-title">Кинотеатр</span>
            </div>
            <div id="theater-player-container">
                <div id="theater-player"></div>
            </div>
            <div id="theater-controls" class="controls">
                <button id="theater-seek-back" class="btn-control" title="−10 сек">⏪</button>
                <button id="theater-play-pause" class="btn-control btn-main" title="Play/Pause">▶️</button>
                <button id="theater-seek-forward" class="btn-control" title="+10 сек">⏩</button>
                <span id="theater-time" class="time-display">0:00</span>
            </div>
        </div>

        <!-- Режим чата (Twitch-style) -->
        <div id="screen-chat" class="screen chat-mode">
            <div class="chat-mode-header">
                <button id="btn-exit-chat" class="btn-icon">✕</button>
                <span>💬 Чат комнаты</span>
            </div>
            <div id="chat-mode-messages" class="chat-mode-messages"></div>
            <div class="chat-mode-input">
                <input type="text" id="chat-mode-input" placeholder="Сообщение..." maxlength="500">
                <button id="btn-chat-mode-send" class="btn btn-primary btn-sm">→</button>
            </div>
        </div>

        <!-- Модалка тем -->
        <div id="theme-modal" class="modal hidden">
            <div class="modal-content">
                <h3>🎨 Выбери тему</h3>
                <div class="theme-grid">
                    <button class="theme-btn" data-theme="dark">🌙 Тёмная</button>
                    <button class="theme-btn" data-theme="light">☀️ Светлая</button>
                    <button class="theme-btn" data-theme="neon">💚 Неон</button>
                    <button class="theme-btn" data-theme="space">🌌 Космос</button>
                </div>
                <button id="btn-close-theme" class="btn btn-secondary">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
